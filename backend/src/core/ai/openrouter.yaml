# OpenRouter model configuration
# Only essential models per provider, optimized for multi-language tasks

# ============================================
# BASE MODELS - для повседневных задач
# ============================================
base:
  # DeepSeek
  - deepseek/deepseek-v3.2
  - deepseek/deepseek-chat
  
  # Qwen (Alibaba)
  - qwen/qwen3-max
  - qwen/qwen3-coder-plus
  
  # Mistral
  - mistralai/mistral-large-2512
  - mistralai/mistral-small-3.2-24b-instruct
  
  # Z.ai (GLM)
  - z-ai/glm-5-turbo
  
  # X.AI (Grok)
  - x-ai/grok-4.20
  - x-ai/grok-4-fast

# ============================================
# REASONING MODELS - для сложных рассуждений, математики, кода
# ============================================
reasoning:
  # DeepSeek
  - deepseek/deepseek-v3.2-speciale
  - deepseek/deepseek-r1-0528
  
  # Qwen
  - qwen/qwen3-max-thinking
  - qwen/qwen3-next-80b-a3b-thinking
  
  # Z.ai (GLM)
  - z-ai/glm-5
  
  # X.AI (Grok)
  - x-ai/grok-4.20-multi-agent

# ============================================
# MULTIMODAL MODELS - текст + изображения
# ============================================
multimodal:
  - qwen/qwen3-vl-235b-a22b-instruct
  - z-ai/glm-5v-turbo
  - mistralai/pixtral-large-2411
  - google/gemini-3.1-flash-image-preview

# ============================================
# LIGHTWEIGHT MODELS - быстрые и дешевые
# ============================================
lightweight:
  - qwen/qwen3-flash-02-23
  - deepseek/deepseek-v3.2-exp
  - mistralai/mistral-small-3.2-24b-instruct
  - z-ai/glm-4.5-air
  - nvidia/nemotron-nano-9b-v2

# ============================================
# MODEL FAMILIES (по провайдерам)
# ============================================
families:
  deepseek:
    - deepseek/deepseek-v3.2
    - deepseek/deepseek-chat
    - deepseek/deepseek-r1-0528
    - deepseek/deepseek-v3.2-speciale
  
  qwen:
    - qwen/qwen3-max
    - qwen/qwen3-max-thinking
    - qwen/qwen3-coder-plus
    - qwen/qwen3-vl-235b-a22b-instruct
  
  mistral:
    - mistralai/mistral-large-2512
    - mistralai/mistral-small-3.2-24b-instruct
    - mistralai/codestral-2508
  
  zai-glm:
    - z-ai/glm-5-turbo
    - z-ai/glm-5
    - z-ai/glm-5v-turbo
    - z-ai/glm-4.5-air
  
  xai-grok:
    - x-ai/grok-4.20
    - x-ai/grok-4.20-multi-agent
    - x-ai/grok-4-fast
  
  nvidia:
    - nvidia/nemotron-3-super-120b-a12b
    - nvidia/nemotron-nano-9b-v2

# ============================================
# SUPPORTED MODELS - стабильные, проверенные для продакшена
# ============================================
supported:
  - deepseek/deepseek-v3.2
  - qwen/qwen3-max
  - mistralai/mistral-large-2512
  - z-ai/glm-5-turbo
  - deepseek/deepseek-chat
  - qwen/qwen3-coder-plus
  - deepseek/deepseek-r1-0528
  - x-ai/grok-4.20

# ============================================
# DEFAULT MODEL
# ============================================
default: deepseek/deepseek-v3.2

# ============================================
# RECOMMENDATIONS BY USE CASE
# ============================================
recommendations:
  general_chat: deepseek/deepseek-v3.2
  coding: qwen/qwen3-coder-plus
  complex_reasoning: deepseek/deepseek-v3.2-speciale
  multilingual: qwen/qwen3-max
  fast_cheap: deepseek/deepseek-v3.2-exp
  vision: qwen/qwen3-vl-235b-a22b-instruct